; UE5 Game Launcher 配置文件
; 放置在与 launcher.exe 相同目录，修改后无需重新编译

[Game]
; 游戏 exe 相对 launcher.exe 的路径
ExePath=XYCJ_ZHGDProject\Binaries\Win64\XYCJ_ZHGDProject-Win64-Shipping.exe

[Requirements]
; 最低可用物理内存(GB)，0=跳过检查
MinFreeRamGB=32.0
; 最低可用显存(GB)，0=跳过检查
MinVramGB=16.0

[Environment]
; 是否检查 DirectX 11（0/1）
CheckDX11=1
; 缺失时是否自动下载安装 DX11（0/1）
AutoInstallDX11=1
; 缺失时是否自动下载安装 VC++ 运行库（0/1）
AutoInstallVC=1
; VC++ x64 运行库下载地址
VCRedistUrl=https://aka.ms/vs/17/release/vc_redist.x64.exe
; DirectX Web Setup 下载地址
DX11SetupUrl=https://go.microsoft.com/fwlink/?LinkID=219729
; DirectX 手动下载页面（自动安装失败时提示）
DX11ManualUrl=https://www.microsoft.com/zh-cn/download/details.aspx?id=35

[ConflictProcesses]
; 冲突进程黑名单，逗号分隔（小写 exe 名）；留空=跳过检测
List=360safe.exe,360tray.exe,360sd.exe,360rp.exe,qhsafemon.exe,qqpcmgr.exe,qqpcmgrprotect.exe,tray.exe,hipstray.exe,hipsdaemon.exe,ksafetray.exe,kxetray.exe,avp.exe,avgnt.exe,msmpeng.exe

[UI.Titles]
ErrorTitle=启动失败 - 系统不支持
WarningTitle=启动检查 - 警告
InstallAskTitle=环境检查 - 缺少运行组件
InstallingTitle=正在安装...
InstallSuccessTitle=安装完成
InstallFailedTitle=安装失败
LaunchErrorTitle=启动错误
TipTitle=提示

[UI.Components]
VcShort=VC++ 运行库
VcFull=VC++ 运行库 (Microsoft Visual C++ Redistributable)
Dx11=DirectX 11 运行时
DefaultGpuName=NVIDIA GPU

[UI.WarningLabels]
Ram=可用内存不足
Vram=可用显存不足
Conflict=检测到冲突进程

[UI.Messages]
ForceRunSuffix=\n\n是否仍要强制运行？
AskInstall=检测到系统未安装 {component}。\n\n是否自动下载并安装？\n（需要网络连接，可能弹出管理员权限窗口）
Installing=正在下载安装 {component}，请稍候...\n\n如果弹出用户账户控制(UAC)窗口，请点击「是」允许安装。
InstallSuccess={component} 安装成功！\n点击确定继续启动。
InstallFailed={component} 安装失败！\n\n{detail}\n\n请手动安装后重试。
DownloadFailed=下载失败，请检查网络连接。\n手动下载地址:\n{url}
DownloadIncomplete=下载文件不完整或损坏。
CannotStartInstaller=无法启动安装程序。
InstallerErrorCode=安装程序返回错误代码。
VcRestartRequired=注意：VC++ 安装要求重启计算机才能生效。\n请重启后再次运行本程序。
DxRestartRequired=DirectX 安装要求重启计算机。\n请重启后再次运行。
DxManualInstallHint=\n\n请手动安装 DirectX 11 End-User Runtime 后重试。
DxAutoInstallFailed=DirectX 11 自动安装失败，游戏无法启动。\n\n请手动下载安装：\n{url}
DxInstallBlockedHint=\n\n请安装 DirectX 11 End-User Runtime 后重试。
DxInstallVerifyFailed=安装完成后仍未通过验证。
D3D11NotFound=未找到 d3d11.dll
D3D11LoadFailed=无法加载 d3d11.dll
D3D11TooOld=d3d11.dll 版本过旧
OsTooOld=操作系统版本过低（需要 Win7 SP1 及以上）
RamWarnLine1=当前内存可用: {avail} GB（总计: {total} GB）
RamWarnLine2=最低内存要求: {min} GB
VramWarnLine1=当前可用显存: {avail} GB（总计: {total} GB）
VramWarnLine2=最低显存要求: {min} GB
ConflictProcPrefix=  * 
ExeNotFound=未找到程序:\n\n{path}
LaunchFailed=启动失败! 错误码: {code}
CombinedWarn=[!] {title}\n\n{details}建议: 升级硬件，关闭其他程序。\n\n是否仍要强制运行？
